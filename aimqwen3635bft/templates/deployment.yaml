apiVersion: apps/v1
kind: Deployment
metadata:
  name: aimqwen3635bft
  namespace: {{ .Release.Namespace }}
  labels:
    app: aimqwen3635bft
    io.kompose.service: aimqwen3635bft
    app.kubernetes.io/managed-by: Helm
  annotations:
spec:
  replicas: {{ .Values.workloads.aimqwen3635bft.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      io.kompose.service: aimqwen3635bft
  template:
    metadata:
      labels:
        app: aimqwen3635bft
        io.kompose.network/chrome-default: "true"
        io.kompose.service: aimqwen3635bft
    spec:
      initContainers:
      - name: check-auth
        image: beclab/wait-for:0.1.0
        imagePullPolicy: IfNotPresent
        command: ["true"]
        args: ["-it", "authelia-backend.user-system-aimighty:9091"]
      - name: render-envoy-config
        image: beclab/busybox:1.28
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          while [ ! -f /var/run/secrets/kubernetes.io/serviceaccount/token ]; do sleep 0.2; done
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          awk -v token="$TOKEN" '{gsub(/__SA_TOKEN__/, token); print}' /work/envoy.yaml > /config/envoy.yaml
          awk -v token="$TOKEN" '{gsub(/__SA_TOKEN__/, token); print}' /work/envoy2.yaml > /config/envoy2.yaml
          cat /config/envoy2.yaml
        volumeMounts:
        - mountPath: /config
          name: envoy-config
        - mountPath: /work/envoy.yaml
          name: olares-sidecar-config
          subPath: envoy.yaml
        - mountPath: /work/envoy2.yaml
          name: olares-sidecar-config
          subPath: envoy2.yaml
      - name: olares-sidecar-init
        image: beclab/init:v1.2.3
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh"]
        resources:
          limits:
            nvidia.com/gpu: "0"
          requests:
            nvidia.com/gpu: "0"
      containers:
      - name: aimqwen3635bft
        image: "{{ .Values.image.full }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - /bin/bash
          - -c
          - /opt/freetoken/entrypoint.sh
        env:
        - name: HF_HOME
          value: /shared-models/huggingface
        - name: HF_TOKEN
          value: {{ .Values.olaresEnv.HF_TOKEN | default "" | quote }}
        - name: MODELS_DIR
          value: /shared-models/llms
        - name: CUDA_DEVICE_MEMORY_LIMIT_0
          value: "30000m"
        envFrom:
        - configMapRef:
            name: aimqwen3635bft-env
        ports:
        - containerPort: {{ .Values.service.port }}
          protocol: TCP
        resources:
          limits:
            cpu: {{ .Values.resources.limits.cpu }}
            memory: {{ .Values.resources.limits.memory }}
            nvidia.com/gpu: {{ index .Values.resources.limits "nvidia.com/gpu" }}
          requests:
            cpu: {{ .Values.resources.requests.cpu }}
            memory: {{ .Values.resources.requests.memory }}
            nvidia.com/gpu: {{ index .Values.resources.requests "nvidia.com/gpu" }}
        startupProbe:
          httpGet:
            path: {{ .Values.probes.startup.path }}
            port: {{ .Values.probes.startup.port }}
          failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
          timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
        livenessProbe:
          httpGet:
            path: {{ .Values.probes.liveness.path }}
            port: {{ .Values.probes.liveness.port }}
          failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
        volumeMounts:
        - name: shared-models
          mountPath: /shared-models
      - name: olares-envoy-sidecar
        image: beclab/envoy:v1.25.11.1
        imagePullPolicy: IfNotPresent
        args: ["--log-level", "debug", "-c", "/config/envoy.yaml", "--service-cluster", "default."]
        env:
        - name: POD_UID
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.uid
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.serviceAccountName
        - name: APP_KEY
        - name: APP_SECRET
        ports:
        - name: proxy-admin
          containerPort: 15000
          protocol: TCP
        - name: proxy-inbound
          containerPort: 15003
          protocol: TCP
        - name: proxy-outbound
          containerPort: 15001
          protocol: TCP
        - name: liveness-port
          containerPort: 15008
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add: ["NET_ADMIN"]
          runAsUser: 1555
        volumeMounts:
        - mountPath: /config
          name: envoy-config
      volumes:
      - name: shared-models
        hostPath:
          path: /olares/share/ai/model
          type: DirectoryOrCreate
      - name: envoy-config
        emptyDir: {}
      - name: olares-sidecar-config
        configMap:
          name: olares-sidecar-config-aimqwen3635bft
          defaultMode: 420
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
